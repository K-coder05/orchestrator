[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "Single-user orchestrator that queues, schedules, runs and reports on headless AI agent Tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orch = "nightshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightshift = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
