# Nightshift configuration.
#
# Copy to ~/.config/nightshift/config.yaml and edit. Every key is optional:
# anything you leave out falls back to the value shown here. The machine,
# plan and credit values below are PLACEHOLDERS, not facts; `orch doctor`
# reads the real values from the machine.
#
# Secrets (API keys, Telegram bot token, calendar iCal URLs) never go in this
# file. Put them in ~/.config/nightshift/.env (mode 0600) or in the macOS
# Keychain under the service named in `secrets.keychain_service`.

timezone: America/Los_Angeles

paths:
  # Task data only (no code). Task folders live under <agents_root>/tasks/.
  agents_root: ~/agents

machine:
  model: 14-inch MacBook Pro
  chip: Apple M3
  ram_gb: 16
  free_disk_gb: 150
  macos_version: "26"

plans:
  claude:
    tier: pro          # pro | max5x
  codex:
    tier: chatgpt-work
  gemini:
    tier: google-ai-pro
    # AI Studio API credits (the paid `gemini-api` agent). The balance as
    # of the end of api_credit_balance_as_of (YYYY-MM-DD; null: before any
    # recorded spend); `orch usage` subtracts the spend recorded after it.
    api_credit_balance_usd: 0
    api_credit_balance_as_of: null
    # YYYY-MM-DD the credits expire; null: no expiry known.
    api_credit_expiry: null

agents:
  claude:
    binary: claude
    # null uses the CLI's own default model.
    model: null
    # Model for the quick planning calls of free-form `orch add` (§2.4).
    # null uses `model`.
    planning_model: haiku
    extra_args: []
  # Codex CLI (`codex exec`): takes over coding Tasks when Claude is out of
  # usage (§2.8). Signed in with the ChatGPT plan (`codex login`).
  codex:
    binary: codex
    # null uses the CLI's own default model.
    model: null
    # Model for planning calls when planning.agent is codex; null uses `model`.
    planning_model: null
    # `model_reasoning_effort` (low | medium | high | ...); null uses the model's default.
    reasoning_effort: null
    # Extra flags for `codex exec`. Flags that change the sandbox, approvals
    # or config (-c, --sandbox, --add-dir, --profile, ...) are refused.
    extra_args: []
  # Gemini CLI (`gemini`, headless with stream-json). Its usage Window is
  # the quota of what it signs in with:
  #   gemini-api-key  an AI Studio API key (free tier: daily and per-minute
  #                   quotas per model, no spend). The key is a secret: put
  #                   it in .env or the Keychain under api_key_secret (a key
  #                   in your shell profile doesn't reach the launchd daemon).
  #   oauth-personal  Sign in with Google (the AI Pro plan; run `gemini` once
  #                   and pick "Sign in with Google"). Google refuses this
  #                   client for AI Pro accounts since 2026-10.
  gemini:
    binary: gemini
    auth: gemini-api-key
    api_key_secret: GEMINI_API_KEY
    # null uses the CLI's own default model ("auto": it picks a model per
    # turn). A model with no quota on the key's tier ("limit: 0") fails.
    model: null
    # Model for planning calls when planning.agent is gemini; null uses `model`.
    planning_model: null
    # Extra flags for `gemini`. Flags that change approvals, the sandbox, the
    # workspace or policies (--yolo, --approval-mode, --sandbox, --policy,
    # --include-directories, -e, ...) are refused.
    extra_args: []
    # The stall guard: an Attempt with a Step in flight, no command running
    # and no output or file change for this long is stuck (§2.7, sooner than
    # stuck.silence_minutes): gemini-cli 0.65.0 waits forever for a "sandbox
    # expansion" answer after a denied command fails. null turns it off.
    stall_minutes: 5
  # The paid Gemini API path (AI Studio credits, §1.5): the same Gemini CLI,
  # signed in with an API key instead of the plan. Runs Tasks given
  # `--agent gemini-api`, and Tasks on `gemini` the paid-credit rule moves
  # here while Gemini is out of usage (only if urgent, or the reset falls
  # after their Catch-up window). Every model call is recorded as spend and counts
  # toward spend.per_task_usd. The key is a secret: put it in .env or the
  # Keychain under the name below, never here. It is the key of a billed
  # project, not the free-tier key of agents.gemini.
  gemini-api:
    binary: gemini
    # null uses the CLI's own default model.
    model: null
    api_key_secret: GEMINI_PAID_API_KEY
    # Same refused flags as agents.gemini.extra_args.
    extra_args: []

defaults:
  agent: claude
  task_type: general
  priority: normal
  # Runtime cap of one Attempt (§2.7); hitting it is a Failed Attempt. A
  # Task type or a template may set its own.
  max_runtime_minutes: 120

retries:
  # Failed Attempts (crash, runtime cap hit, failed post-hook) are retried on
  # the same agent up to this many times (§2.7); then the Task is failed.
  max_retries: 2
  # Minutes in retry_wait before each retry (the last value repeats).
  wait_minutes: [10, 30]

stuck:
  # Stuck detection (§2.7). A stuck Attempt is stopped and retried once with
  # a note about what it was stuck on; stuck again, the Task needs you. Not
  # a Failed Attempt: the retry budget above is not charged.
  # Stuck after this many minutes with no output from the agent and no file
  # change in the Task folder (a command running for a Step in flight
  # doesn't count as silence). null turns this trigger off.
  silence_minutes: 15
  # Stuck after the same tool call (same tool, same input) this many times
  # in a row (2 or more). null turns this trigger off.
  repeat_calls: 3

usage:
  # Usage-limit pauses and resume (§2.6).
  # A paused Task resumes its own agent session if the session is younger
  # than this; otherwise a fresh session starts from plan.md + progress.md.
  resume_session_max_hours: 24
  # A Task paused longer than this needs re-approval (`orch approve`).
  reapproval_after_hours: 72
  # A limit hit with no reset time: every this many minutes Nightshift sends
  # a minimal probe request to see whether the Window has reset.
  probe_interval_minutes: 30
  # A probe that takes longer than this counts as failed.
  probe_timeout_seconds: 120
  # On a limit hit, the Step in progress may finish for up to this long
  # before the agent is stopped.
  step_grace_seconds: 120
  # Reset time reported by a simulated limit (--simulate-rate-limit-after).
  simulated_reset_minutes: 5
  # On a real limit hit the agent CLI usually ends the session itself; it
  # gets this long to do so (and report its usage) before it is stopped.
  limit_exit_wait_seconds: 10
  # Proactive thresholds (§1.5). They apply only to a Window that has a
  # Baseline; until then only actual limit errors pause. At this percent of
  # a Window's Baseline no new Task starts on that agent (running Tasks
  # continue).
  stop_starting_percent: 80
  # Daytime reserve: inside these hours (HH:MM, end exclusive, `timezone`)
  # background Tasks on these agents may use at most this percent of each
  # Window's Baseline; the rest is kept for interactive use.
  daytime_reserve:
    start: "08:00"
    end: "23:00"
    agents: [claude]
    background_max_percent: 75
  # Each agent's usage Windows and their length in hours (§1.5). Limit
  # observations and Baselines are kept per Window; `orch usage` lists these.
  # Claude: a rolling 5-hour Window plus a weekly cap.
  windows:
    claude: {five_hour: 5, seven_day: 168}
    # Codex (ChatGPT plan): a 5-hour Window plus a weekly cap. Its limit
    # messages don't name the Window, so a hit counts as the shortest one.
    codex: {five_hour: 5, seven_day: 168}
    # Gemini (an AI Studio key's free tier, or Google AI Pro): daily quotas
    # per model, reset at midnight Pacific. A hit that doesn't say "daily"
    # also counts as this Window (the CLI retries per-minute quotas itself).
    gemini: {daily: 24}

planning:
  # Free-form `orch add` asks an agent for an estimate and a Task type (§2.4).
  # null uses defaults.agent.
  agent: null
  # Tasks estimated above this many minutes get a plan.md and need approval.
  approval_threshold_minutes: 30
  # A planning call that takes longer than this fails `orch add`.
  timeout_seconds: 180

queue:
  # Priority, deadlines and time windows (§2.3). All times are in `timezone`.
  # A Task whose deadline is this close (or passed) counts as urgent.
  deadline_urgent_hours: 24
  # Long Tasks start only inside this window (HH:MM, end exclusive), unless
  # urgent. A Task is long when its template or Task type says so.
  long_window_start: "00:00"
  long_window_end: "07:00"

templates:
  # Template YAML files (§3.1 item 9); null = the repo's templates/ folder.
  dir: null
  # Inputs of the resume-tailor template. Copied into each Task folder
  # (input/) when the Task is created; the originals are never changed.
  resume_tailor:
    master_tex: ~/Documents/career/resume/master.tex
    cover_letter_template: ~/Documents/career/resume/cover_letter_template.tex
  # Inputs of the posting-scan template (§1.8). Fill these in: the public
  # internship tracker repos (GitHub URLs) and your target companies' career
  # page URLs the daily scan checks. Never LinkedIn. company-rescrape
  # re-scrapes the same career_pages every 2 days (snapshots and diffs in
  # <agents_root>/data/snapshots/company-rescrape/).
  posting_scan:
    # Only postings for this season match; Nightshift rejects other rows.
    season: Summer 2027
    tracker_repos: []
    career_pages: []
  # How post-hooks compile LaTeX. They run Nightshift-side after the Attempt,
  # sandboxed: no network, nothing under your home folder readable except
  # the Task folder and readable_dirs, writes only in the Task folder.
  latex:
    # null finds latexmk, else the engine itself, on PATH.
    binary: null
    # pdflatex | xelatex | lualatex
    engine: pdflatex
    timeout_seconds: 120
    # TeX's own per-user folders (your packages and font caches).
    readable_dirs:
      - ~/Library/texmf
      - ~/Library/texlive

tracker:
  # The application Tracker (§1.7). Only Nightshift writes it, never an
  # agent. null = <agents_root>/data/applications.csv.
  path: null

daemon:
  # launchd LaunchAgent label; the plist is ~/Library/LaunchAgents/<label>.plist.
  label: com.nightshift.daemon
  # How often the daemon checks for newly queued Tasks (when idle, and while
  # one lane is busy and the other free).
  poll_seconds: 5
  # How many Attempts may run at once, in all. Each lane runs one Task at
  # a time whatever this is (SPEC §5 item 5): the Claude lane (Claude, or
  # Codex when it has taken over for Claude) and the Gemini lane (Gemini
  # and its paid API path). 2 runs both lanes at once; 1 runs one Task at
  # a time.
  max_running: 2

dashboard:
  # Read-only web dashboard (§4 item 8), served by its own launchd agent
  # (`orch dashboard install`). It binds to 127.0.0.1 and, with
  # `tailscale: true`, this Mac's Tailscale address: never 0.0.0.0, the LAN
  # or a public address. With Tailscale wanted but not connected it refuses
  # to start (launchd retries until Tailscale is up).
  port: 8765
  tailscale: true
  # launchd LaunchAgent label; the plist is ~/Library/LaunchAgents/<label>.plist.
  label: com.nightshift.dashboard

wake:
  # Optional scheduled wake (§1.9). `orch doctor` prints the pmset command
  # built from these; Nightshift never runs it. days: any of MTWRFSU.
  days: MTWRFSU
  time: "01:55:00"

doctor:
  # Mismatch tolerance for free disk versus machine.free_disk_gb (fraction).
  free_disk_tolerance: 0.2

task_types:
  # internet: default for --internet when the Task doesn't set it (§1.4).
  # long: Tasks of this type are long Tasks, gated to the overnight window
  # (§2.3). Omitted means false.
  # max_runtime_minutes: this type's runtime cap; omitted means
  # defaults.max_runtime_minutes. Coding runs overnight, so it gets 6 hours.
  # failover: the agents this type may run on, in order of preference
  # (§2.8). When the Task's agent is out of usage the Task moves to the first
  # other one that isn't; if all are out it waits and resumes on whichever
  # resets first. The second retry of a Failed Attempt may also switch
  # (§2.7). `when: deadline` fails over only when the deadline is within
  # queue.deadline_urgent_hours, and flags it in the report's Needs you.
  # A type without failover always waits for its agent. A Task with --agent
  # never moves.
  general: {internet: "off"}
  coding:
    internet: "off"
    long: true
    max_runtime_minutes: 360
    failover: {agents: [claude, codex], when: always}
  # YouTube comedy writing always waits for Claude.
  comedy: {internet: "off"}
  research:
    internet: "on"
    long: true
    failover: {agents: [claude, gemini], when: always}
  scraping:
    internet: "on"
    failover: {agents: [claude, gemini], when: always}
  # Long-document and lecture summaries.
  summary:
    internet: "off"
    failover: {agents: [claude, gemini], when: always}
  job: {internet: "on"}
  # Resume and cover-letter tailoring waits for Claude's reset unless the
  # deadline is near; then Gemini, or Codex if Gemini is also out.
  resume:
    internet: "on"
    failover: {agents: [claude, gemini, codex], when: deadline}
  # Study plans and practice problems.
  study:
    internet: "on"
    failover: {agents: [claude, gemini], when: always}

school:
  # Your school folder (§1.4): slides, syllabi. Agents may read it, never
  # write it, so it must be in permissions.read_only_dirs. The study-guide
  # template reads only folders inside it.
  dir: ~/school
  # Each course's AI policy (§1.6). It wins over everything else: Nightshift
  # injects it at the top of the agent protocol of every Task for that
  # course. A Task naming a course with no policy here refuses to start.
  # Key: a course id (lowercase letters, digits, - or _). A request or a
  # calendar event names the course by its id, name or an alias, ignoring
  # case, spaces, - and _ ("CS 61A" = "cs61a" = "CS-61A"). Per course:
  #   name: how it is written (default: the id)
  #   aliases: other names for it
  #   policy: the course's AI policy as text, e.g. pasted from the syllabus
  #   limits: hard limits, one rule per line, the agent must never break
  #   ai_allowed: false if the course allows no AI use at all; Nightshift
  #     then refuses every Task for it (default true)
  # Example:
  #   cs61a:
  #     name: CS 61A
  #     aliases: [61A]
  #     policy: |
  #       AI may be used to study and to explain course concepts. Never use
  #       it to write or debug code for graded assignments.
  #     limits:
  #       - No solutions to homework, lab or project problems
  # A course's calendar events are matched by title the same way, so add
  # the name your calendars use as an alias (bCourses titles look like
  # "HW 05 [COMPSCI 61A]": add "COMPSCI 61A").
  courses: {}
  # The weekly school-roundup Schedule (Sunday 8pm) and course due-date
  # deadlines read your bCourses calendar feed and your Google Calendar
  # private iCal link. Both URLs are secrets: put them in .env or the
  # Keychain as BCOURSES_ICAL_URL and GOOGLE_CALENDAR_ICAL_URL, never here
  # (`orch doctor` says whether they are set). Nightshift fetches them
  # itself; agents never see the URLs.
  calendar:
    # How far ahead the roundup looks, and how far ahead a course due date
    # may be to become a course Task's deadline.
    lookahead_days: 14
    # A course Task's deadline comes from the latest fetch; one older than
    # this is fetched again first.
    refresh_hours: 12
    # Each feed's fetch gives up after this long.
    timeout_seconds: 20

comedy:
  # Your YouTube comedy material (§1.4): scripts, ideas, bits. Agents may read
  # it, never write it, so it must be in permissions.read_only_dirs. The
  # punch-up template reads only material inside it. Unreleased material goes
  # to the model providers and nowhere else: Telegram gets status lines only.
  dir: ~/Documents/comedy

permissions:
  # Per-Task agent access (§1.4). The Task folder is the only writable place.
  # docs/safety.md says which of these limits are technically enforced.
  # Folders every Task may read but never write. Missing folders are skipped.
  read_only_dirs:
    - ~/Documents/career
    - ~/Documents/comedy
    - ~/school
  # Never readable or writable. <agents_root>/data is always added.
  no_access_dirs:
    - ~/.ssh
    - ~/.gnupg
    - ~/.aws
    - ~/.config/nightshift
    - ~/Library/Keychains
    - ~/Library/Cookies
    - ~/Library/Safari
    - ~/Library/Application Support/Google/Chrome
    - ~/Library/Application Support/Firefox
    - ~/Library/Application Support/BraveSoftware
    - ~/Library/Application Support/Arc
  # Under your home folder, shell commands can read only the Task folder, the
  # read-only folders and these tool installs (so `node`, `uv` etc. still run).
  tool_dirs:
    - ~/.nvm
    - ~/.local/bin
    - ~/.local/share/uv
    - ~/.bun
    - ~/.cargo/bin
    - ~/.pyenv
  # Web fetch never goes to these domains or their subdomains (§1.6).
  denied_domains:
    - linkedin.com
    - lnkd.in
    - licdn.com
  # Shell commands the agent may not run. Shell commands have no network
  # anyway (the sandbox blocks it); this list is a best-effort second layer.
  denied_commands:
    - curl
    - wget
    - nc
    - ncat
    - netcat
    - socat
    - telnet
    - ftp
    - sftp
    - scp
    - ssh
    - rsync
    - python -c
    - python3 -c
    - node -e
    - perl -e
    - ruby -e
    - osascript
    - open
    - security
    - sudo
    - brew
    - launchctl
    - pmset
    - git push
    - gh

spend:
  # Paid-per-use caps (§1.5). Only the Gemini API path (agents.gemini-api)
  # spends money; subscription agents never record spend.
  # A Task that reaches this much is stopped and moved to needs_you.
  per_task_usd: 2
  # Once paid calls reach this much in a day (America/Los_Angeles), every
  # paid Task pauses (paused_spend) until midnight, then resumes on its own.
  per_day_usd: 5
  # Once they reach this much in a calendar month, paid Tasks pause and you
  # get a "needs you" request to raise the cap (`orch raise-cap USD`, this
  # month only); they resume once it is raised or the month ends.
  per_month_usd: 15
  # AI Studio prices in USD per million tokens, used to price each call.
  # PLACEHOLDERS: check https://ai.google.dev/gemini-api/docs/pricing and
  # update them. Where a model has a long-context tier, its higher price is
  # used (spend errs high). Thinking tokens are billed as output. A model not
  # listed is priced as `default`.
  gemini_api_prices:
    default: {input: 4.0, cached_input: 0.4, output: 18.0}
    gemini-3-pro-preview: {input: 4.0, cached_input: 0.4, output: 18.0}
    gemini-2.5-pro: {input: 2.5, cached_input: 0.25, output: 15.0}
    gemini-2.5-flash: {input: 0.3, cached_input: 0.03, output: 2.5}
    gemini-2.5-flash-lite: {input: 0.1, cached_input: 0.01, output: 0.4}

telegram:
  # Outbound alerts (§2.12): a message when a Task finishes (its one-line
  # Result), fails, or needs you. Usage pauses stay silent. Comedy Tasks get
  # status lines only. Uses long polling only: no port is opened.
  # Off until user_id is set and the bot token is in .env or the Keychain as
  # TELEGRAM_BOT_TOKEN (create the bot with @BotFather, then send it a
  # message once so it may write to you).
  # Your numeric Telegram user ID (ask @userinfobot). Nightshift writes to
  # this user only, takes commands (send the bot `help`) from this user
  # only, and ignores, and logs, messages from anyone else.
  user_id: null
  # Long-polling timeout of each getUpdates call.
  poll_timeout_seconds: 30
  # An alert Telegram could not take (an outage) is retried until it is this
  # old, then dropped; the Task itself is never held up.
  alert_max_age_hours: 12
  # One digest of everything since the previous one (finished, failed, needs
  # you, usage and spend pauses, retries, cancels) at this local time
  # (`timezone`). Asleep then: sent once on wake, never twice.
  digest_time: "08:00"

github:
  # GitHub (§5 item 6). Agents commit locally; they can't push or reach
  # GitHub. To push, or to create a repo, an agent raises a "needs you"
  # request (kind github_push / github_create_repo); once you approve it,
  # Nightshift does it itself with a fine-grained token stored as the secret
  # GITHUB_TOKEN (.env or the Keychain), which no agent ever gets.
  # The repos (owner/name) Nightshift may push to or create. A request for
  # any other repo is refused without asking you. Empty: GitHub is off.
  repos: []
  # Task types whose Task folder gets a local git repo (repo/), set up by
  # Nightshift, that the agent commits to.
  git_task_types: [coding]
  # The author of the agent's commits. null: your own `git config --global`
  # user.name / user.email, read when the repo is set up.
  commit_name: null
  commit_email: null
  # Each GitHub API call or git push gives up after this long.
  timeout_seconds: 60

secrets:
  keychain_service: nightshift
