# research-report (§5 item 3): a research report on a topic. Usage:
#   orch add "Research <topic, and what I want to know about it>" --template research-report
#   (Telegram: add research-report <request>)
#
# The agent researches the topic with its web search and fetch tools and
# writes the report to output/research.md. Nightshift's research_rules
# post-hook (not the agent) enforces the §2.11 Research rules on that file:
# every claim cites a URL or is labelled *unverified*, at least 5 distinct
# sources, never under one page (500 words of body text). Any miss is a
# Failed Attempt. The report gets a Sources section Nightshift writes from
# the file.
#
# A `research` Task: internet on, long (starts midnight-7am unless urgent),
# fails over to Gemini when Claude is out (§2.8). The estimate is over 30
# minutes, so a one-off gets a plan.md to approve (§2.4).
name: research-report
description: A research report on a topic, every claim cited (at least 5 sources)
task_type: research
agent: claude
estimated_minutes: 45
max_runtime_minutes: 120
long: true
internet: "on"

values:
  denied_domains: {config: permissions.denied_domains}

post_hooks:
  - hook: require_outputs
    files: [output/research.md]
  - hook: research_rules
    file: output/research.md
    min_sources: 5
    min_words: 500

prompt: |
  Write a research report on a topic for me. My request:
  "{{request}}"

  Do this in order, keeping `progress.md` current after each step:

  1. Work out the questions the request asks. If it is too vague to
     research, or asks for something on the never-list (contacting anyone,
     logging in, paying), write `needs_you.json` and stop.
  2. Research it with your web search and fetch tools. Prefer primary and
     reputable sources (official sites, papers, documentation, established
     news); use at least 5 distinct sources, more when the question needs
     them. Note each source's URL as you go. Never visit these domains or
     follow links to them:
  {{denied_domains}}
     Respect robots.txt and site terms. Never log in, create an account,
     fill in a form or contact anyone.
  3. Write the report to `output/research.md` in Markdown:
     - A `# <title>` line, then sections with `##` headings. Length fits the
       question, but never under one page: at least 500 words of body text.
     - Cite every claim. Each sentence that states a fact ends with a
       numbered marker such as `[1]` or `[2, 4]`, naming entries of the
       Sources section (a sentence may instead carry the URL itself, as a
       Markdown link). This includes topic sentences that open a
       paragraph, and the summary or conclusion.
     - A claim you couldn't find a source for gets the label `*unverified*`
       in its sentence, exactly so (with the asterisks). Never invent a
       source or cite one that doesn't say what you claim.
     - End with a `## Sources` section, one numbered line per source, in
       this form:

           1. <title of the page> - <full URL>

       Every entry must be cited at least once in the text.
  4. Write `report.md`. Under Summary give the answer in brief; don't list
     the sources there (Nightshift adds a Sources section from
     `output/research.md`).

  Nightshift checks `output/research.md` after you finish and fails this
  Attempt if any sentence making a claim has no citation and no
  `*unverified*` label, if fewer than 5 distinct source URLs are cited, if
  a `[n]` has no Sources entry, or if the text is under 500 words. If
  `logs/nightshift.log` shows a failed post-hook from an earlier Attempt,
  fix what it names first.
