<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
{% block head %}{% endblock %}
<title>{% block title %}Nightshift{% endblock %}</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --line: #2a2e36; --text: #e4e6eb; --muted: #8b919c;
    --link: #8cc4ff;
    --running: #6cb6ff; --queued: #a8b1bd; --paused: #e0b44c; --needs: #f08c5a;
    --done: #57c785; --failed: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  a { color: var(--link); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .asof { color: var(--muted); font-size: 13px; white-space: nowrap; }
  code { font: 12px ui-monospace, Menlo, monospace; }
  nav { font-size: 14px; margin-bottom: 10px; }
  .controls { margin-top: 8px; }
  .controls .buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .controls form { margin: 0; display: flex; gap: 6px; }
  .controls button, .controls select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-height: 34px;
  }
  .controls button { cursor: pointer; }
  .controls button:active { background: var(--line); }
  .controls .b-cancel { color: var(--failed); }
  .controls .b-retry, .controls .b-resume { color: var(--running); }
  .controls .b-pause { color: var(--paused); }
  .controls.htmx-request { opacity: 0.6; }
  .outcome { font-size: 13px; margin: 0 0 6px; overflow-wrap: anywhere; color: var(--done); }
  .outcome.refused { color: var(--failed); }
  .outcome.note { color: var(--muted); }
{% block style %}{% endblock %}
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
